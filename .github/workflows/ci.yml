name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: montreallion_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/montreallion_test
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run etl:test
      - name: create Supabase client roles (anon/authenticated) for the RLS test
        run: psql "$TEST_DATABASE_URL" -c "create role anon nologin; create role authenticated nologin;"
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: e2e (memory store)
        run: npx playwright test
      - name: e2e (postgres store)
        run: npx playwright test
        env: { DATABASE_URL: "postgres://postgres:postgres@localhost:5432/montreallion_test", DATABASE_POOL_MAX: "2" }
